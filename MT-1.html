<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid ;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <th colspan="5" align="centre">Class Timetable (Semester I)</th>
        </tr>
        <tr>
            <td><b>Day</b></td>
            <td><b>9:00-10:00</b></td>
            <td><b>10:00-11:00</b></td>
            <td><b>11:00-12:00</b></td>
            <td><b>12:00:-1:00</b></td>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>Mathematics</td>
            <td>Programming</td>
            <td rowspan="5"><b>Lunch Break</b> (12:00-1:00)</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Mathmatics</td>
            <td>HTML</td>
            <td>English</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Programming</td>
            <td>English</td>
            <td>HTML</td>
            
        </tr>
        <tr>
            <td>Thursday</td>
            <td>English</td>
            <td>Programming</td>
            <td>Mathematics</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>HTML</td>
            <td>English</td>
            <td>Programming</td>
        </tr>
    </table>
    
</body>
</html>
